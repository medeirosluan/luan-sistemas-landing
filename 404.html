<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Página não encontrada | LuanSistemas</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      font-family: 'Inter', system-ui, sans-serif;
      background: radial-gradient(circle at 15% 20%, rgba(99,102,241,.35), transparent 45%),
                  radial-gradient(circle at 85% 75%, rgba(225,29,72,.3), transparent 45%),
                  #0a0a1a;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    .wrap { max-width: 460px; }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 40px;
    }
    .brand-logo {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: linear-gradient(135deg, #6366f1, #06b6d4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 16px;
    }
    .brand-name { font-size: 20px; font-weight: 800; }
    .brand-name span { color: #818cf8; }
    h1 {
      font-size: 88px;
      font-weight: 900;
      background: linear-gradient(135deg, #6366f1, #06b6d4);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      line-height: 1;
    }
    p { color: #94a3b8; margin: 18px 0 32px; font-size: 1.05rem; }
    a {
      display: inline-block;
      padding: 13px 28px;
      border-radius: 100px;
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      font-size: .95rem;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="brand">
      <span class="brand-logo">&lt;/&gt;</span>
      <span class="brand-name">Luan<span>Sistemas</span></span>
    </div>
    <h1>404</h1>
    <p>Essa página não existe ou foi movida. Volte para conhecer o PDV e o Zelo.</p>
